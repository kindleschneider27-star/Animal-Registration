spring:
  application:
    name: AnimalRegistration
  thymeleaf:
    cache: false
  datasource:
    url: "jdbc:h2:file:./data/animal-registration;DB_CLOSE_ON_EXIT=FALSE"
    username: admin
    password: pets
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  


logging:
  file:
    name: log/animal-registration.log
  logback:
    rollingpolicy:
      file-name-pattern: "logs/animal-registration-%d{yyyy-MM-dd}.%i.log"
      max-file-size: 10MB
      max-history: 30


